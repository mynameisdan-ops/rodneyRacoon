name: Deploy

# Publishes the game to GitHub Pages (https://<owner>.github.io/<repo>/) on every push to main,
# or by hand from the Actions tab. Until Pages is turned on for the repo (Settings → Pages →
# Source: GitHub Actions) it checks, says so and stops without failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Is GitHub Pages on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off for this repo, so nothing was deployed."
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.pages.outputs.enabled == 'true'
      - run: npm test
        if: steps.pages.outputs.enabled == 'true'
      # Pages serves the site from /<repo>/, so every URL in the build starts there.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
